<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - EMAGES Academy</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff6b4a;
            --primary-dark: #ff8c42;
            --dark: #1a1a2e;
            --dark-secondary: #16213e;
            --light: #f8f9fa;
            --white: #ffffff;
            --text-gray: #7f8c8d;
            --gradient: linear-gradient(135deg, #ff6b4a 0%, #ff8c42 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark);
            background-image: linear-gradient(135deg, rgba(26, 26, 46, 0.95) 0%, rgba(22, 33, 62, 0.95) 100%), url('assets/hero.jpg');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: var(--white);
            width: 100%;
            max-width: 420px;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
            position: relative;
            animation: fadeInUp 0.6s ease;
        }

        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .login-logo img { height: 40px; width: auto; }
        .login-logo .texto-logo { display: flex; flex-direction: column; text-align: left; }
        .login-logo .marca { font-size: 1.3rem; font-weight: 800; color: var(--dark); line-height: 1; }
        .login-logo .submarca { font-size: 0.65rem; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }

        .login-title { font-size: 1.5rem; font-weight: 700; color: var(--dark); margin-bottom: 10px; }
        .login-subtitle { font-size: 0.9rem; color: var(--text-gray); margin-bottom: 30px; }

        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--dark); margin-bottom: 8px; }
        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            background: var(--light);
        }
        .form-control:focus { outline: none; border-color: var(--primary); background: var(--white); box-shadow: 0 0 0 4px rgba(255, 107, 74, 0.1); }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(255, 107, 74, 0.3);
            margin-top: 10px;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(255, 107, 74, 0.5); }
        .btn-login:disabled { background: #bdc3c7; cursor: not-allowed; transform: none; box-shadow: none; }

        .mensaje { margin-top: 15px; font-size: 0.9rem; min-height: 20px; }
        .mensaje.error { color: #e74c3c; font-weight: 600; }
        .mensaje.exito { color: #27ae60; font-weight: 600; }

        .divider { margin: 25px 0; position: relative; text-align: center; }
        .divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: #e9ecef; }
        .divider span { background: var(--white); padding: 0 15px; color: var(--text-gray); font-size: 0.85rem; position: relative; }

        .register-link { font-size: 0.9rem; color: var(--text-gray); }
        .register-link a { color: var(--primary); text-decoration: none; font-weight: 700; transition: color 0.3s; }
        .register-link a:hover { color: var(--primary-dark); }

        .help-link { margin-top: 15px; font-size: 0.85rem; color: var(--text-gray); }
        .help-link a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .help-link a:hover { text-decoration: underline; }

        .btn-volver {
            position: absolute; top: 20px; left: 20px;
            color: rgba(255,255,255,0.7); text-decoration: none;
            font-size: 0.9rem; font-weight: 600;
            display: flex; align-items: center; gap: 5px;
            transition: color 0.3s;
        }
        .btn-volver:hover { color: white; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 480px) { .login-container { padding: 40px 25px; } }
    </style>
</head>
<body>

    <a href="campus.html" class="btn-volver">← Volver</a>

    <div class="login-container">
        <div class="login-logo">
            <img src="assets/Pluma-sin-fondo.png" alt="EMAGES Academy">
            <div class="texto-logo">
                <span class="marca">EMAGES Academy</span>
                <span class="submarca">Centro de Formación</span>
            </div>
        </div>

        <h1 class="login-title">Bienvenido de nuevo</h1>
        <p class="login-subtitle">Ingresa tu DNI y celular para acceder</p>

        <form id="formularioLogin">
            <div class="form-group">
                <label for="dni">DNI</label>
                <input type="text" id="dni" class="form-control" placeholder="Ingresa tu DNI (8 dígitos)" maxlength="8" inputmode="numeric" required>
            </div>

            <div class="form-group">
                <label for="celular">Celular</label>
                <input type="tel" id="celular" class="form-control" placeholder="Ingresa tu celular (9 dígitos)" maxlength="9" inputmode="numeric" required>
            </div>

            <button type="submit" class="btn-login" id="btnIngresar">Ingresar al Panel</button>
        </form>

        <div id="mensaje" class="mensaje"></div>

        <div class="help-link">
            ¿El celular no coincide? <a href="actualizar_datos_campus.html">Actualiza tus datos aquí</a>
        </div>

        <div class="divider">
            <span>¿Aún no tienes cuenta?</span>
        </div>

        <p class="register-link">
            <a href="registro_campus.html">Regístrate gratis aquí</a>
        </p>
    </div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw6xpApuz9Es7NGuDlVefKemVYEPVo3MZcrS71DAGa3YQmLLIkmEY6KSLtBJlmJ_3Yr/exec';

    document.getElementById('formularioLogin').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('btnIngresar');
        const mensajeDiv = document.getElementById('mensaje');
        const dni = document.getElementById('dni').value.trim();
        const celular = document.getElementById('celular').value.trim();

        if (dni.length !== 8 || celular.length !== 9) {
            mensajeDiv.className = 'mensaje error';
            mensajeDiv.textContent = '⚠️ Verifica que el DNI tenga 8 dígitos y el celular 9.';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Validando...';
        mensajeDiv.textContent = '';

        const datos = { accion: 'login', dni: dni, celular: celular };

        fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(datos) })
        .then(response => response.json())
        .then(data => {
            if (data.exito) {
                mensajeDiv.className = 'mensaje exito';
                mensajeDiv.textContent = '✅ Acceso validado. Redirigiendo...';
                
                sessionStorage.setItem('emages_dni', dni);
                sessionStorage.setItem('emages_nombre', data.datos.nombres);
                
                setTimeout(() => { window.location.href = 'panel_campus.html'; }, 1000);
            } else {
                mensajeDiv.className = 'mensaje error';
                if (data.mensaje && data.mensaje.includes('celular no coincide')) {
                    mensajeDiv.innerHTML = '❌ El celular no coincide con el registrado.<br><a href="actualizar_datos_campus.html" style="color: #e74c3c; font-weight: bold; text-decoration: underline;">📱 Actualizar mis datos</a>';
                } else {
                    mensajeDiv.textContent = '❌ ' + data.mensaje;
                }
                btn.disabled = false;
                btn.textContent = 'Ingresar al Panel';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            mensajeDiv.className = 'mensaje error';
            mensajeDiv.textContent = '❌ Error de conexión. Intenta nuevamente.';
            btn.disabled = false;
            btn.textContent = 'Ingresar al Panel';
        });
    });
</script>

</body>
</html>
