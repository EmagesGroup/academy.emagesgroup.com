<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - EMAGES Academy</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff6b4a;
            --primary-dark: #ff8c42;
            --dark: #1a1a2e;
            --dark-secondary: #16213e;
            --light: #f8f9fa;
            --white: #ffffff;
            --text-gray: #7f8c8d;
            --gradient: linear-gradient(135deg, #ff6b4a 0%, #ff8c42 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark);
            /* Fondo con degradado sutil y la imagen de fondo difuminada */
            background-image: 
                linear-gradient(135deg, rgba(26, 26, 46, 0.95) 0%, rgba(22, 33, 62, 0.95) 100%), 
                url('assets/hero.jpg');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Contenedor principal del Login */
        .login-container {
            background: var(--white);
            width: 100%;
            max-width: 420px;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
            position: relative;
            animation: fadeInUp 0.6s ease;
        }

        /* Logo en el login */
        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .login-logo img {
            height: 40px;
            width: auto;
        }
        .login-logo .texto-logo {
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        .login-logo .marca {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--dark);
            line-height: 1;
        }
        .login-logo .submarca {
            font-size: 0.65rem;
            color: var(--primary);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 10px;
        }
        .login-subtitle {
            font-size: 0.9rem;
            color: var(--text-gray);
            margin-bottom: 30px;
        }

        /* Formulario */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
        }
        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            background: var(--light);
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(255, 107, 74, 0.1);
        }

        /* Opciones extra (Recordarme / Olvidé contraseña) */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.85rem;
        }
        .form-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-gray);
            cursor: pointer;
        }
        .form-options a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        .form-options a:hover { color: var(--primary-dark); }

        /* Botón de acceso */
        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(255, 107, 74, 0.3);
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(255, 107, 74, 0.5);
        }

        /* Separador */
        .divider {
            margin: 25px 0;
            position: relative;
            text-align: center;
        }
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e9ecef;
        }
        .divider span {
            background: var(--white);
            padding: 0 15px;
            color: var(--text-gray);
            font-size: 0.85rem;
            position: relative;
        }

        /* Link de registro */
        .register-link {
            font-size: 0.9rem;
            color: var(--text-gray);
        }
        .register-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s;
        }
        .register-link a:hover { color: var(--primary-dark); }

        /* Botón volver */
        .btn-volver {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.3s;
        }
        .btn-volver:hover { color: white; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .login-container { padding: 40px 25px; }
        }
    </style>
</head>
<body>

    <!-- Botón para volver al inicio -->
    <a href="campus.html" class="btn-volver">← Volver al inicio</a>

    <div class="login-container">
        <!-- Logo -->
        <div class="login-logo">
            <img src="assets/Pluma-sin-fondo.png" alt="EMAGES Academy">
            <div class="texto-logo">
                <span class="marca">EMAGES Academy</span>
                <span class="submarca">Centro de Formación</span>
            </div>
        </div>

        <h1 class="login-title">Bienvenido de nuevo</h1>
        <p class="login-subtitle">Ingresa tus credenciales para acceder a tu campus</p>

        <!-- Formulario -->
        <form action="#" method="POST">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" class="form-control" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox"> Recordarme
                </label>
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>

        <div class="divider">
            <span>¿Aún no tienes cuenta?</span>
        </div>

        <p class="register-link">
            <a href="registro_campus.html">Regístrate gratis aquí</a>
        </p>
    </div>

</body>
</html>
