<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Degradado naranja a negro (colores del Gallito de las Rocas) -->
    <linearGradient id="plumaGradiente" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B4A;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FF8C42;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#C44536;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A2E;stop-opacity:1" />
    </linearGradient>
    
    <!-- Degradado para el tallo (raquis) -->
    <linearGradient id="talloGradiente" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0A0A15;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Grupo de la pluma con rotación para dinamismo -->
  <g transform="translate(100, 100) rotate(-15) translate(-100, -100)">
    
    <!-- Barbas izquierdas (más oscuras) -->
    <path d="M 100 30 
             C 85 40, 70 55, 60 75
             C 55 85, 58 90, 65 88
             C 75 85, 85 75, 95 65
             Z" 
          fill="url(#plumaGradiente)" opacity="0.9"/>
    
    <path d="M 100 50 
             C 80 60, 65 80, 55 100
             C 50 110, 53 115, 60 113
             C 72 110, 85 95, 95 80
             Z" 
          fill="url(#plumaGradiente)" opacity="0.95"/>
    
    <path d="M 100 75 
             C 78 85, 62 105, 52 125
             C 48 133, 52 137, 58 135
             C 70 130, 85 115, 95 100
             Z" 
          fill="url(#plumaGradiente)"/>
    
    <!-- Barbas derechas (más claras, naranjas) -->
    <path d="M 100 30 
             C 115 40, 130 55, 140 75
             C 145 85, 142 90, 135 88
             C 125 85, 115 75, 105 65
             Z" 
          fill="url(#plumaGradiente)" opacity="0.9"/>
    
    <path d="M 100 50 
             C 120 60, 135 80, 145 100
             C 150 110, 147 115, 140 113
             C 128 110, 115 95, 105 80
             Z" 
          fill="url(#plumaGradiente)" opacity="0.95"/>
    
    <path d="M 100 75 
             C 122 85, 138 105, 148 125
             C 152 133, 148 137, 142 135
             C 130 130, 115 115, 105 100
             Z" 
          fill="url(#plumaGradiente)"/>
    
    <!-- Barba central superior (la más larga) -->
    <path d="M 100 20 
             C 110 35, 120 55, 125 80
             C 128 95, 125 100, 120 98
             C 112 95, 105 80, 100 60
             Z" 
          fill="url(#plumaGradiente)"/>
    
    <!-- Tallo central (raquis) -->
    <path d="M 100 25 
             C 98 50, 95 80, 92 110
             C 90 130, 88 150, 85 165
             C 84 170, 86 172, 88 170
             C 92 165, 95 145, 98 125
             C 100 105, 102 75, 103 50
             C 104 35, 103 28, 101 25
             Z" 
          fill="url(#talloGradiente)"/>
    
    <!-- Detalle brillante en el tallo -->
    <path d="M 101 30 
             C 100 50, 98 75, 96 100
             C 95 110, 94 120, 93 130
             C 93 132, 94 132, 95 130
             C 96 120, 97 110, 98 100
             C 100 75, 101 50, 102 30
             Z" 
          fill="white" opacity="0.15"/>
  </g>
</svg>
