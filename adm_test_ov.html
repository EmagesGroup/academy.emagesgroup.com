<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - EMAGES Academy</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 800px; margin: 0 auto; }
        h1 { color: #e74c3c; text-align: center; margin-bottom: 2rem; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background-color: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        button:hover { background-color: #c0392b; }
        .btn-buscar { background-color: #3498db; margin-top: 10px; }
        .btn-buscar:hover { background-color: #2980b9; }
        .btn-pdf { background-color: #27ae60; margin-top: 20px; font-size: 1.1rem; }
        .btn-pdf:hover { background-color: #229954; }
        .resultado { display: none; margin-top: 30px; padding: 20px; background: #f9f9f9; border-radius: 8px; }
        .info-estudiante { background: #e8f4f8; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .info-estudiante p { margin: 8px 0; }
        .info-resultado { background: #fef9e7; padding: 15px; border-radius: 6px; }
        .info-resultado h3 { margin-top: 0; color: #e74c3c; }
        .puntajes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .puntaje-item { background: white; padding: 10px; border-radius: 6px; text-align: center; }
        .puntaje-item strong { display: block; font-size: 1.2rem; color: #e74c3c; }
        .error { color: #e74c3c; text-align: center; margin-top: 10px; font-weight: bold; }
        .exito { color: #27ae60; text-align: center; margin-top: 10px; font-weight: bold; }
        .cargando { color: #2980b9; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Panel Administrativo EMAGES</h1>
    
    <div style="margin-bottom: 20px;">
        <label style="font-weight: bold;">Buscar estudiante por DNI:</label>
        <input type="text" id="dniBusqueda" placeholder="Ingresa el DNI (8 dígitos)" maxlength="8">
        <button onclick="buscarEstudiante()" class="btn-buscar">🔍 Buscar</button>
        <p id="mensajeBusqueda"></p>
    </div>

    <div class="resultado" id="resultadoBusqueda">
        <div class="info-estudiante">
            <h3>👤 Datos del Estudiante</h3>
            <p><strong>DNI:</strong> <span id="resDni"></span></p>
            <p><strong>Nombres:</strong> <span id="resNombres"></span></p>
            <p><strong>Celular:</strong> <span id="resCelular"></span></p>
            <p><strong>Correo:</strong> <span id="resCorreo"></span></p>
        </div>

        <div class="info-resultado">
            <h3>🎯 Resultado del Test Vocacional</h3>
            <p><strong>Perfil:</strong> <span id="resPerfil" style="font-size: 1.3rem; color: #e74c3c;"></span></p>
            <p><strong>Fecha:</strong> <span id="resFecha"></span></p>
            
            <h4 style="margin-top: 20px;">Puntajes por Área:</h4>
            <div class="puntajes">
                <div class="puntaje-item"><strong id="resR">0</strong>Realista</div>
                <div class="puntaje-item"><strong id="resI">0</strong>Investigador</div>
                <div class="puntaje-item"><strong id="resA">0</strong>Artístico</div>
                <div class="puntaje-item"><strong id="resS">0</strong>Social</div>
                <div class="puntaje-item"><strong id="resE">0</strong>Emprendedor</div>
                <div class="puntaje-item"><strong id="resC">0</strong>Convencional</div>
            </div>
        </div>

        <button onclick="generarPDF()" class="btn-pdf">📄 Descargar PDF</button>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw6xpApuz9Es7NGuDlVefKemVYEPVo3MZcrS71DAGa3YQmLLIkmEY6KSLtBJlmJ_3Yr/exec';
    
    let datosEstudiante = null;
    let datosResultado = null;

    function buscarEstudiante() {
        const dni = document.getElementById('dniBusqueda').value;
        const mensajeDiv = document.getElementById('mensajeBusqueda');
        
        if (!dni || dni.length !== 8) {
            mensajeDiv.className = 'error';
            mensajeDiv.textContent = '️ Ingresa un DNI válido de 8 dígitos';
            return;
        }

        mensajeDiv.className = 'cargando';
        mensajeDiv.textContent = '🔍 Buscando...';
        
        const datos = { accion: 'buscarEstudiante', dni: dni };
        
        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(datos)
        })
        .then(response => {
            console.log('Respuesta recibida:', response);
            return response.json();
        })
        .then(data => {
            console.log('Datos:', data);
            
            if (data.exito) {
                datosEstudiante = data.estudiante;
                datosResultado = data.resultado;
                
                document.getElementById('resDni').textContent = datosEstudiante.dni;
                document.getElementById('resNombres').textContent = datosEstudiante.nombres;
                document.getElementById('resCelular').textContent = datosEstudiante.celular;
                document.getElementById('resCorreo').textContent = datosEstudiante.correo;
                
                if (datosResultado) {
                    document.getElementById('resPerfil').textContent = datosResultado.perfil;
                    document.getElementById('resFecha').textContent = new Date(datosResultado.fecha).toLocaleString('es-PE');
                    document.getElementById('resR').textContent = datosResultado.puntajeR;
                    document.getElementById('resI').textContent = datosResultado.puntajeI;
                    document.getElementById('resA').textContent = datosResultado.puntajeA;
                    document.getElementById('resS').textContent = datosResultado.puntajeS;
                    document.getElementById('resE').textContent = datosResultado.puntajeE;
                    document.getElementById('resC').textContent = datosResultado.puntajeC;
                } else {
                    document.getElementById('resPerfil').textContent = 'Sin resultados de test';
                    document.getElementById('resFecha').textContent = '-';
                    document.getElementById('resR').textContent = '0';
                    document.getElementById('resI').textContent = '0';
                    document.getElementById('resA').textContent = '0';
                    document.getElementById('resS').textContent = '0';
                    document.getElementById('resE').textContent = '0';
                    document.getElementById('resC').textContent = '0';
                }
                
                document.getElementById('resultadoBusqueda').style.display = 'block';
                mensajeDiv.className = 'exito';
                mensajeDiv.textContent = '✅ Estudiante encontrado';
            } else {
                mensajeDiv.className = 'error';
                mensajeDiv.textContent = '❌ ' + data.mensaje;
                document.getElementById('resultadoBusqueda').style.display = 'none';
            }
        })
        .catch(error => {
            console.error('Error completo:', error);
            mensajeDiv.className = 'error';
            mensajeDiv.textContent = '❌ Error de conexión. Revisa la consola (F12) para más detalles.';
            document.getElementById('resultadoBusqueda').style.display = 'none';
        });
    }

    function generarPDF() {
        if (!datosEstudiante || !datosResultado) {
            alert('No hay datos para generar el PDF');
            return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        const dni = datosEstudiante.dni;
        const nombres = datosEstudiante.nombres.replace(/\s+/g, '_');
        const nombreArchivo = `${dni}_${nombres}.pdf`;
        
        doc.setFillColor(231, 76, 60);
        doc.rect(0, 0, 210, 40, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(24);
        doc.text('EMAGES Academy', 105, 20, { align: 'center' });
        doc.setFontSize(14);
        doc.text('Informe de Evaluación Vocacional', 105, 30, { align: 'center' });
        
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(16);
        doc.text('Datos del Estudiante', 20, 60);
        
        doc.setFontSize(12);
        doc.text(`DNI: ${datosEstudiante.dni}`, 20, 75);
        doc.text(`Nombres: ${datosEstudiante.nombres}`, 20, 85);
        doc.text(`Celular: ${datosEstudiante.celular}`, 20, 95);
        doc.text(`Correo: ${datosEstudiante.correo}`, 20, 105);
        
        doc.setFontSize(16);
        doc.text('Resultado del Test Vocacional', 20, 130);
        
        doc.setFontSize(14);
        doc.setTextColor(231, 76, 60);
        doc.text(`Perfil: ${datosResultado.perfil}`, 20, 145);
        
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(12);
        doc.text(`Fecha de evaluación: ${new Date(datosResultado.fecha).toLocaleString('es-PE')}`, 20, 155);
        
        doc.setFontSize(14);
        doc.text('Puntajes por Área:', 20, 175);
        
        doc.setFontSize(12);
        const areas = [
            { nombre: 'Realista', puntaje: datosResultado.puntajeR },
            { nombre: 'Investigador', puntaje: datosResultado.puntajeI },
            { nombre: 'Artístico', puntaje: datosResultado.puntajeA },
            { nombre: 'Social', puntaje: datosResultado.puntajeS },
            { nombre: 'Emprendedor', puntaje: datosResultado.puntajeE },
            { nombre: 'Convencional', puntaje: datosResultado.puntajeC }
        ];
        
        let yPos = 190;
        areas.forEach(area => {
            doc.text(`${area.nombre}: ${area.puntaje} puntos`, 20, yPos);
            yPos += 10;
        });
        
        doc.setFontSize(10);
        doc.setTextColor(128, 128, 128);
        doc.text('EMAGES GROUP S.A.C. - RUC: 20611427671', 105, 280, { align: 'center' });
        doc.text('www.emagesgroup.com', 105, 285, { align: 'center' });
        
        doc.save(nombreArchivo);
    }
</script>

</body>
</html>
