<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel - EMAGES Academy</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff6b4a;
            --primary-dark: #ff8c42;
            --dark: #1a1a2e;
            --dark-secondary: #16213e;
            --light: #f8f9fa;
            --white: #ffffff;
            --success: #27ae60;
            --warning: #f39c12;
            --text-gray: #7f8c8d;
            --gradient: linear-gradient(135deg, #ff6b4a 0%, #ff8c42 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark);
            background-image: linear-gradient(135deg, rgba(26, 26, 46, 0.97) 0%, rgba(22, 33, 62, 0.97) 100%), url('assets/hero.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--dark);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        /* HEADER DEL PANEL */
        .panel-header {
            background: var(--white);
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }
        .panel-header .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .panel-header .logo img { height: 42px; width: auto; }
        .panel-header .logo-text .marca { font-size: 1.3rem; font-weight: 800; color: var(--dark); line-height: 1; }
        .panel-header .logo-text .submarca { font-size: 0.65rem; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }

        .user-info { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .user-info .datos { text-align: right; }
        .user-info .nombre { font-size: 1rem; font-weight: 700; color: var(--dark); }
        .user-info .perfil { font-size: 0.8rem; color: var(--primary); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        
        .btn-logout {
            background: var(--dark);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
        }
        .btn-logout:hover { background: var(--dark-secondary); transform: translateY(-2px); }

        /* SWITCH DE HIJOS */
        .switch-hijos {
            background: var(--white);
            padding: 20px 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            display: none;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .switch-hijos.active { display: flex; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(24px); }
        .switch-text strong { display: block; color: var(--dark); font-size: 0.95rem; }
        .switch-text p { font-size: 0.8rem; color: var(--text-gray); margin: 0; }

        /* GRID DE TARJETAS */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        
        .card {
            background: var(--white);
            border-radius: 16px;
            padding: 30px 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            transition: all 0.3s;
            position: relative;
            border-top: 4px solid transparent;
        }
        .card:hover { transform: translateY(-5px); border-top-color: var(--primary); box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
        .card-icon { font-size: 2.5rem; margin-bottom: 15px; }
        .card h3 { font-size: 1.2rem; margin-bottom: 10px; color: var(--dark); font-weight: 700; }
        .card p { font-size: 0.9rem; color: var(--text-gray); line-height: 1.6; flex-grow: 1; margin-bottom: 20px; }
        
        .btn-card {
            display: block;
            width: 100%;
            padding: 12px;
            text-align: center;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
        }
        .btn-primary { background: var(--gradient); color: white; box-shadow: 0 4px 15px rgba(255, 107, 74, 0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255, 107, 74, 0.5); }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-whatsapp:hover { background: #128C7E; transform: translateY(-2px); }
        
        /* Tarjeta bloqueada */
        .card.locked { opacity: 0.9; background: #fdf2f0; border-top: 4px solid var(--primary); }
        /* Por defecto, los botones en tarjetas bloqueadas están deshabilitados */
        .card.locked .btn-card { background: #bdc3c7; color: #7f8c8d; cursor: not-allowed; pointer-events: none; box-shadow: none; }
        
        .lock-badge {
            position: absolute; top: 15px; right: 15px;
            background: var(--primary); color: white;
            font-size: 0.7rem; padding: 4px 10px;
            border-radius: 20px; font-weight: 700;
            letter-spacing: 1px;
        }

        /* ESTADO DEL CV */
        .cv-status {
            background: #e8f4f8;
            border-left: 4px solid #3498db;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--dark);
        }
        .cv-status.warning { background: #fff9e6; border-left-color: var(--warning); }
        .cv-status.critical { background: #fdf2f0; border-left-color: var(--primary); }
        .cv-status a { color: var(--primary); font-weight: 700; text-decoration: none; }
        .cv-status a:hover { text-decoration: underline; }

        .cargando {
            text-align: center;
            padding: 80px 20px;
            font-size: 1.2rem;
            color: white;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
        }
        .oculto { display: none !important; }

        @media (max-width: 600px) {
            .panel-header { flex-direction: column; text-align: center; }
            .user-info { justify-content: center; }
            .user-info .datos { text-align: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="cargando" class="cargando">⏳ Cargando tu perfil...</div>

    <div id="panelContent" class="oculto">
        <!-- HEADER -->
        <div class="panel-header">
            <div class="logo">
                <img src="assets/Pluma-sin-fondo.png" alt="EMAGES Academy">
                <div class="logo-text">
                    <span class="marca">EMAGES Academy</span>
                    <span class="submarca">Mi Panel</span>
                </div>
            </div>
            <div class="user-info">
                <div class="datos">
                    <div class="nombre" id="userName">Cargando...</div>
                    <div class="perfil" id="userPerfil"></div>
                </div>
                <button class="btn-logout" onclick="cerrarSesion()">🚪 Cerrar Sesión</button>
            </div>
        </div>

        <!-- SWITCH DE HIJOS (solo para PROFESIONAL) -->
        <div id="switchHijos" class="switch-hijos">
            <label class="switch">
                <input type="checkbox" id="toggleHijos" onchange="toggleSimulacrosHijos()">
                <span class="slider"></span>
            </label>
            <div class="switch-text">
                <strong>¿Tienes hijos en edad de admisión?</strong>
                <p>Activa esta opción para gestionar sus simulacros y ver su progreso.</p>
            </div>
        </div>

        <!-- GRID DE TARJETAS -->
        <div class="grid" id="cardsGrid"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw6xpApuz9Es7NGuDlVefKemVYEPVo3MZcrS71DAGa3YQmLLIkmEY6KSLtBJlmJ_3Yr/exec';
    let usuarioActual = null;
    let tiempoInactividad;

    // 1. Verificar sesión (sessionStorage = se borra al cerrar pestaña)
    const dniSession = sessionStorage.getItem('emages_dni');
    if (!dniSession) { window.location.href = 'login_campus.html'; }

    // 2. Auto-cierre por inactividad (30 minutos)
    function reiniciarTemporizador() {
        clearTimeout(tiempoInactividad);
        tiempoInactividad = setTimeout(cerrarSesion, 30 * 60 * 1000);
    }
    window.onload = reiniciarTemporizador;
    window.onmousemove = reiniciarTemporizador;
    window.onkeypress = reiniciarTemporizador;
    window.ontouchstart = reiniciarTemporizador;

    // 3. Cargar datos del usuario
    fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ accion: 'obtenerPerfilPanel', dni: dniSession }) })
    .then(res => res.json())
    .then(data => {
        if (data.exito) {
            usuarioActual = data.usuario;
            document.getElementById('cargando').classList.add('oculto');
            document.getElementById('panelContent').classList.remove('oculto');
            
            document.getElementById('userName').textContent = usuarioActual.nombres;
            document.getElementById('userPerfil').textContent = `Perfil: ${usuarioActual.perfil}`;
            
            if (usuarioActual.perfil === 'PROFESIONAL') {
                document.getElementById('switchHijos').classList.add('active');
            }
            
            renderizarTarjetas();
        } else {
            alert('Error al cargar el perfil. Por favor, inicia sesión nuevamente.');
            cerrarSesion();
        }
    })
    .catch(err => {
        console.error(err);
        document.getElementById('cargando').textContent = '❌ Error de conexión. Recarga la página.';
    });

    // 4. Renderizado dinámico de tarjetas
    function renderizarTarjetas() {
        const grid = document.getElementById('cardsGrid');
        const perfil = usuarioActual.perfil;
        let html = '';

        // ==========================================
        // EVALUACIÓN VOCACIONAL (CON LÓGICA DE 3 INTENTOS)
        // ==========================================
        if (perfil === 'ESTUDIANTE' || perfil === 'TRANSICION') {
            const intentosUsados = usuarioActual.intentosTest || 0;
            const intentosRestantes = 3 - intentosUsados;
            
            if (intentosUsados >= 3) {
                // BLOQUEADO: Ya usó los 3 intentos
                const msgWA = `Hola EMAGES Academy, soy ${usuarioActual.nombres} (DNI: ${usuarioActual.dni}). He completado mis 3 intentos del Test Vocacional y quisiera solicitar información para reactivar mi acceso.`;
                
                html += `
                <div class="card locked">
                    <span class="lock-badge">🔒 3/3 INTENTOS</span>
                    <div class="card-icon">📝</div>
                    <h3>Evaluación Vocacional</h3>
                    <p>Has completado los 3 intentos permitidos. Tu perfil vocacional ha sido registrado en nuestro sistema.</p>
                    <a href="https://wa.me/51930175586?text=${encodeURIComponent(msgWA)}" target="_blank" 
                       class="btn-card btn-whatsapp" 
                       style="pointer-events: auto; background: #25D366; color: white;">
                       💬 Solicitar Reactivación
                    </a>
                </div>`;
            } else {
                // DISPONIBLE: Aún tiene intentos
                html += `
                <div class="card">
                    <div class="card-icon">📝</div>
                    <h3>Evaluación Vocacional</h3>
                    <p>Descubre tu perfil profesional con nuestro test RIASEC. Te quedan <strong>${intentosRestantes} intento(s)</strong>.</p>
                    <a href="test-vocacional.html" class="btn-card btn-primary">Iniciar Evaluación (${intentosRestantes} restantes)</a>
                </div>`;
            }
        }

        // ==========================================
        // EVALUACIONES DE COMPETENCIAS
        // ==========================================
        if (perfil === 'ESTUDIANTE') {
            html += `
            <div class="card locked">
                <span class="lock-badge">🔒 BLOQUEADO</span>
                <div class="card-icon">💼</div>
                <h3>Evaluaciones de Competencias</h3>
                <p>Desbloquea esta sección al cumplir 18 años y subir tu CV. Nuestros aliados empresariales te considerarán en sus convocatorias.</p>
                <button class="btn-card" disabled>Requiere 18+ años y CV</button>
            </div>`;
        } else {
            html += `
            <div class="card">
                <div class="card-icon">💼</div>
                <h3>Evaluaciones de Competencias</h3>
                <p>Evalúa tus habilidades blandas y razonamiento corporativo. Obtén un reporte para adjuntar a tu CV y destacar en procesos de selección.</p>
                <a href="#" class="btn-card btn-primary" onclick="alert('Módulo de evaluaciones en desarrollo. ¡Próximamente!')">Realizar Evaluación</a>
                ${renderizarEstadoCV()}
            </div>`;
        }

        // ==========================================
        // CURSOS PROFESIONALES
        // ==========================================
        if (perfil === 'ESTUDIANTE') {
            html += `
            <div class="card locked">
                <span class="lock-badge">🔒 BLOQUEADO</span>
                <div class="card-icon">🛠️</div>
                <h3>Cursos Profesionales</h3>
                <p>Invierte en tu futuro laboral. Cursos prácticos (Cajero Bancario, Planillas, RRHH) diseñados para cuando empieces a trabajar.</p>
                <button class="btn-card" disabled>Próximamente</button>
            </div>`;
        } else {
            const msgWA = `Hola EMAGES Academy, soy ${usuarioActual.nombres} (DNI: ${usuarioActual.dni}). Quiero información sobre precios y promociones de Cursos Profesionales.`;
            html += `
            <div class="card">
                <div class="card-icon">🛠️</div>
                <h3>Cursos Profesionales</h3>
                <p>Capacitación certificada en Cajero Bancario, Asistente de Planillas y Reclutamiento. Invierte en tu ascenso laboral.</p>
                <a href="https://wa.me/51930175586?text=${encodeURIComponent(msgWA)}" target="_blank" class="btn-card btn-whatsapp">💬 Consultar Promociones</a>
            </div>`;
        }

        // ==========================================
        // CERTIFICADOS
        // ==========================================
        html += `
        <div class="card">
            <div class="card-icon">🏆</div>
            <h3>Mis Certificados</h3>
            <p>Descarga y verifica tus certificados de cursos completados. Comparte tu logro con empleadores.</p>
            <a href="https://verificar.academy.emagesgroup.com" target="_blank" class="btn-card btn-primary">Verificar Certificados</a>
        </div>`;

        grid.innerHTML = html;
    }

    // 5. Estado del CV
    function renderizarEstadoCV() {
        if (!usuarioActual.fechaUltimoCV || usuarioActual.fechaUltimoCV === '') {
            return `
            <div class="cv-status critical">
                ⚠️ <strong>Aún no has subido tu CV.</strong><br>
                Hazlo ahora para desbloquear oportunidades con nuestros aliados empresariales.
                <br><br>
                <a href="#">📥 Descargar Plantillas Oficiales</a> | <a href="#">📤 Subir mi CV</a>
            </div>`;
        }

        const hoy = new Date();
        const fechaCV = new Date(usuarioActual.fechaUltimoCV);
        const diffTime = Math.abs(hoy - fechaCV);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays <= 90) {
            return `<div class="cv-status">✅ <strong>¡Tu CV está actualizado!</strong> Última vez hace ${diffDays} días. Estás listo para nuevas oportunidades.</div>`;
        } else if (diffDays <= 180) {
            return `
            <div class="cv-status warning">
                💡 <strong>¿Has adquirido nuevas habilidades?</strong><br>
                Tu última actualización fue hace ${diffDays} días. Considera refrescar tu CV para reflejar tu crecimiento.
                <br><br>
                <a href="#">📥 Ver Plantillas Actualizadas</a>
            </div>`;
        } else {
            return `
            <div class="cv-status critical">
                ⚠️ <strong>Tu CV podría estar obsoleto.</strong><br>
                Han pasado ${diffDays} días. El mercado cambia rápido. Actualiza tu CV con nuestras plantillas vigentes para recibir 3x más respuestas.
                <br><br>
                <a href="#"> Descargar Plantillas Vigentes</a> | <a href="#">📤 Subir Nueva Versión</a>
            </div>`;
        }
    }

    // 6. Toggle de hijos
    function toggleSimulacrosHijos() {
        const checkbox = document.getElementById('toggleHijos');
        usuarioActual.perfil = checkbox.checked ? 'PROFESIONAL_CON_HIJOS' : 'PROFESIONAL';
        renderizarTarjetas();
    }

    // 7. Cerrar sesión
    function cerrarSesion() {
        sessionStorage.clear();
        window.location.href = 'login_campus.html';
    }
</script>

</body>
</html>
