<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - EMAGES Academy</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff6b4a;
            --primary-dark: #ff8c42;
            --dark: #1a1a2e;
            --dark-secondary: #16213e;
            --light: #f8f9fa;
            --white: #ffffff;
            --text-gray: #7f8c8d;
            --gradient: linear-gradient(135deg, #ff6b4a 0%, #ff8c42 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark);
            background-image: linear-gradient(135deg, rgba(26, 26, 46, 0.95) 0%, rgba(22, 33, 62, 0.95) 100%), url('assets/hero.jpg');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .register-container {
            background: var(--white);
            width: 100%;
            max-width: 480px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
            position: relative;
            animation: fadeInUp 0.6s ease;
        }

        .register-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        .register-logo img { height: 35px; width: auto; }
        .register-logo .texto-logo { display: flex; flex-direction: column; text-align: left; }
        .register-logo .marca { font-size: 1.2rem; font-weight: 800; color: var(--dark); line-height: 1; }
        .register-logo .submarca { font-size: 0.6rem; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }

        .register-title { font-size: 1.4rem; font-weight: 700; color: var(--dark); margin-bottom: 8px; }
        .register-subtitle { font-size: 0.85rem; color: var(--text-gray); margin-bottom: 25px; }

        .form-row { display: flex; gap: 15px; }
        .form-group { margin-bottom: 15px; text-align: left; flex: 1; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--dark); margin-bottom: 6px; }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            background: var(--light);
        }
        .form-control:focus { outline: none; border-color: var(--primary); background: var(--white); box-shadow: 0 0 0 4px rgba(255, 107, 74, 0.1); }

        /* Checkbox personalizado */
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            text-align: left;
            margin: 15px 0 20px;
            font-size: 0.8rem;
            color: var(--text-gray);
        }
        .checkbox-group input { margin-top: 3px; accent-color: var(--primary); cursor: pointer; }
        .checkbox-group a { color: var(--primary); text-decoration: none; font-weight: 600; }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(255, 107, 74, 0.3);
        }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(255, 107, 74, 0.5); }
        .btn-register:disabled { background: #bdc3c7; cursor: not-allowed; transform: none; box-shadow: none; }

        .mensaje { margin-top: 15px; font-size: 0.85rem; min-height: 20px; }
        .mensaje.error { color: #e74c3c; font-weight: 600; }
        .mensaje.exito { color: #27ae60; font-weight: 600; }

        .login-link { margin-top: 20px; font-size: 0.85rem; color: var(--text-gray); }
        .login-link a { color: var(--primary); text-decoration: none; font-weight: 700; }
        .login-link a:hover { text-decoration: underline; }

        .btn-volver {
            position: absolute; top: 20px; left: 20px;
            color: rgba(255,255,255,0.7); text-decoration: none;
            font-size: 0.9rem; font-weight: 600;
            display: flex; align-items: center; gap: 5px;
            transition: color 0.3s;
        }
        .btn-volver:hover { color: white; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 500px) { 
            .register-container { padding: 30px 20px; } 
            .form-row { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>

    <a href="campus.html" class="btn-volver">← Volver</a>

    <div class="register-container">
        <div class="register-logo">
            <img src="assets/Pluma-sin-fondo.png" alt="EMAGES Academy">
            <div class="texto-logo">
                <span class="marca">EMAGES Academy</span>
                <span class="submarca">Centro de Formación</span>
            </div>
        </div>

        <h1 class="register-title">Crea tu cuenta gratis</h1>
        <p class="register-subtitle">Únete a nuestra comunidad y empieza a formarte hoy</p>

        <form id="formularioRegistro">
            <div class="form-row">
                <div class="form-group">
                    <label for="dni">DNI</label>
                    <input type="text" id="dni" class="form-control" placeholder="8 dígitos" maxlength="8" inputmode="numeric" required>
                </div>
                <div class="form-group">
                    <label for="celular">Celular</label>
                    <input type="tel" id="celular" class="form-control" placeholder="9 dígitos" maxlength="9" inputmode="numeric" required>
                </div>
            </div>

            <div class="form-group">
                <label for="nombres">Nombres y Apellidos</label>
                <input type="text" id="nombres" class="form-control" placeholder="Como aparece en tu DNI" required>
            </div>

            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" class="form-control" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="fechaNacimiento">Fecha de nacimiento</label>
                <input type="date" id="fechaNacimiento" class="form-control" required>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="privacidad" required>
                <label for="privacidad">Acepto las <a href="privacidad.html" target="_blank">Políticas de Privacidad</a> y Condiciones de EMAGES GROUP.</label>
            </div>

            <button type="submit" class="btn-register" id="btnEnviar">Crear mi cuenta</button>
        </form>

        <div id="mensaje" class="mensaje"></div>

        <p class="login-link">
            ¿Ya tienes cuenta? <a href="login_campus.html">Inicia sesión aquí</a>
        </p>
    </div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw6xpApuz9Es7NGuDlVefKemVYEPVo3MZcrS71DAGa3YQmLLIkmEY6KSLtBJlmJ_3Yr/exec';

    // Configurar fecha máxima (hoy) para el input de fecha
    const hoy = new Date().toISOString().split('T')[0];
    document.getElementById('fechaNacimiento').setAttribute('max', hoy);

    document.getElementById('formularioRegistro').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('btnEnviar');
        const mensajeDiv = document.getElementById('mensaje');
        
        const dni = document.getElementById('dni').value.trim();
        const celular = document.getElementById('celular').value.trim();
        const nombres = document.getElementById('nombres').value.trim();
        const correo = document.getElementById('correo').value.trim();
        const fechaNacimiento = document.getElementById('fechaNacimiento').value;

        // Validaciones básicas
        if (dni.length !== 8 || celular.length !== 9) {
            mensajeDiv.className = 'mensaje error';
            mensajeDiv.textContent = '⚠️ Verifica que el DNI tenga 8 dígitos y el celular 9.';
            return;
        }

        // Validación de edad (14 años mínimo)
        const fechaNac = new Date(fechaNacimiento);
        const hoyDate = new Date();
        let edad = hoyDate.getFullYear() - fechaNac.getFullYear();
        const mesDiff = hoyDate.getMonth() - fechaNac.getMonth();
        if (mesDiff < 0 || (mesDiff === 0 && hoyDate.getDate() < fechaNac.getDate())) { edad--; }
        
        if (edad < 14) {
            mensajeDiv.className = 'mensaje error';
            mensajeDiv.textContent = '⚠️ Debes tener al menos 14 años para registrarte.';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Creando cuenta...';
        mensajeDiv.textContent = '';

        const datos = { 
            accion: 'registrar', 
            dni: dni, 
            nombres: nombres, 
            celular: celular, 
            correo: correo, 
            fechaNacimiento: fechaNacimiento 
        };

        fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(datos) })
        .then(response => response.json())
        .then(data => {
            if (data.exito) {
                mensajeDiv.className = 'mensaje exito';
                mensajeDiv.textContent = '✅ ¡Cuenta creada! Redirigiendo a tu panel...';
                
                sessionStorage.setItem('emages_dni', dni);
                sessionStorage.setItem('emages_nombre', nombres);
                
                setTimeout(() => { window.location.href = 'panel_campus.html'; }, 1500);
            } else {
                mensajeDiv.className = 'mensaje error';
                mensajeDiv.textContent = '❌ ' + data.mensaje;
                btn.disabled = false;
                btn.textContent = 'Crear mi cuenta';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            mensajeDiv.className = 'mensaje error';
            mensajeDiv.textContent = '❌ Error de conexión. Intenta nuevamente.';
            btn.disabled = false;
            btn.textContent = 'Crear mi cuenta';
        });
    });
</script>

</body>
</html>
